<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{% block description %}DevOps &amp; Cloud Infrastructure Engineer — IaC, CI/CD, Kubernetes, GCP, AWS, OCI{% endblock %}" />

  <!-- Open Graph -->
  <meta property="og:site_name" content="{{ SITENAME }}" />
  <meta property="og:title" content="{% block og_title %}{{ SITENAME }}{% endblock %}" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="{{ SITEURL }}" />

  <!-- Fonts via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ── Nav ──────────────────────────────────────────────── -->
<nav class="site-nav">
  <div class="site-wrap">
    <a href="{{ SITEURL }}/" class="nav-logo">tighov<span>.</span>link</a>
    <ul class="nav-links">
      <li class="nav-hide"><a href="{{ SITEURL }}/">writing</a></li>
      <li><a href="{{ SITEURL }}/projects.html">projects</a></li>
      <li class="nav-hide"><a href="{{ SITEURL }}/cv/">cv</a></li>
      <li><a href="mailto:{{ CONTACT_EMAIL }}" class="nav-cta">get in touch</a></li>
    </ul>
  </div>
</nav>

{% block content %}{% endblock %}

<!-- ── Footer ───────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="site-wrap">
    <div class="footer-inner">
      <p class="footer-copy">
        © {{ COPYRIGHT_YEAR }} Tigran Hovhannisyan &mdash;
        powered by <a href="https://getpelican.com" target="_blank" rel="noopener">Pelican</a>
      </p>
      <ul class="footer-links">
        <li><a href="https://linkedin.com/in/thetigran" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="https://github.com/tighov" target="_blank" rel="noopener">GitHub</a></li>
        <li><a href="{{ SITEURL }}/feeds/all.atom.xml">RSS</a></li>
      </ul>
    </div>
  </div>
</footer>

</body>
</html>
