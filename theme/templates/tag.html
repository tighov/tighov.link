{% extends "base.html" %}
{% block title %}{{ tag }} | {{ SITENAME }}{% endblock %}

{% block content %}
<div class="site-wrap">
  <div class="page-header">
    <p class="hero-eyebrow">Tag</p>
    <h1 class="page-title">{{ tag }}</h1>
  </div>
  <div class="posts-col" style="max-width:660px; border-right:none; padding-right:0;">
    {% for article in articles %}
    <article class="post-item">
      <div class="post-meta">
        <span class="post-date">{{ article.date.strftime('%d %b %Y') }}</span>
      </div>
      <h2 class="post-title">
        <a href="{{ SITEURL }}/{{ article.url }}" style="color:inherit;text-decoration:none;">{{ article.title }}</a>
      </h2>
    </article>
    {% endfor %}
  </div>
</div>
{% endblock %}
